<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{- if not .IsHome }}{{ partial "header.html" . }}{{ end }}
  <article id="main">
    {{ block "main" . }}{{ end }}
    {{ partial "footer.html" . }}
  </article>
</body>
</html>
